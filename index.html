#ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,rgba(25,25,25,.88),rgba(25,25,25,.05));pointer-events:none}
#hud{position:absolute;top:12px;right:12px;z-index:30;display:none;gap:8px;flex-direction:column;align-items:flex-end}
.hudBox{min-width:170px;padding:9px 14px;border-radius:14px;background:rgba(0,0,0,.66);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);font-weight:700;text-align:right}
#score{font-size:22px;color:#ffd95a}
#best{font-size:14px;color:#d8e4ff}
#menu{
 position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,rgba(10,18,35,.88),rgba(25,25,25,.55));backdrop-filter:blur(5px);
 transition:transform .9s cubic-bezier(.75,0,.2,1),opacity .9s;
}
#menu.hide{transform:translateX(-110%);opacity:0;pointer-events:none}
.menuCard{width:min(92vw,480px);padding:28px;border-radius:28px;background:rgba(12,15,24,.86);border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 70px rgba(0,0,0,.45);color:white;text-align:center}
.menuCard h1{margin:0 0 8px;font-size:32px}
.menuCard p{margin:8px 0 20px;color:#cbd3e3;line-height:1.8}
input{width:100%;padding:14px 16px;border:1px solid #596274;border-radius:14px;background:#1c2230;color:#fff;font-size:16px;outline:none}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer}
#startBtn{background:#311c57;color:#ddd4d4}
#resetNameBtn{background:#2b3446;color:#fff}
#leaderboard{margin-top:20px;text-align:right}
#leaderboard h3{margin:0 0 10px;color:#ffd34d}
.lbRow{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.09);color:#e8edf7}
.lbRow span:last-child{font-weight:800;color:#ffd34d}
#rollImage{position:absolute;z-index:70;top:-170px;left:50%;width:110px;height:110px;object-fit:contain;transform:translateX(-50%) rotate(0deg);display:none;pointer-events:none}
#rollImage.roll{display:block;animation:rollDown 1.7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rollDown{
 0%{top:-170px;transform:translateX(-50%) rotate(0deg)}
 72%{top:calc(100vh - 125px);transform:translateX(-50%) rotate(760deg)}
 100%{top:calc(100vh + 20px);transform:translateX(-50%) rotate(900deg)}
}
#game{position:absolute;inset:0;z-index:10;overflow:hidden;display:none}
#game.ready{display:block}
#player{
 position:absolute;z-index:20;left:10vw;bottom:13%;width:120px;height:90px;
 object-fit:contain;cursor:pointer;user-select:none;filter:drop-shadow(0 8px 5px rgba(0,0,0,.55));
 transition:filter .15s;
}
#player:active{filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.obstacle{position:absolute;z-index:18;bottom:13%;width:75px;height:85px;object-fit:contain;user-select:none;pointer-events:none;filter:drop-shadow(0 5px 3px rgba(0,0,0,.45))}
.textObstacle{width:auto;height:auto;min-width:100px;padding:10px 13px;border-radius:14px;background:rgba(5,10,20,.82);border:2px solid #fff;color:#fff;font-size:20px;font-weight:900;text-align:center;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#boss{position:absolute;z-index:25;right:-190px;bottom:13%;width:150px;height:150px;object-fit:contain;display:none;filter:drop-shadow(0 12px 7px rgba(0,0,0,.6))}
#tapHint{position:absolute;z-index:28;left:50%;top:16%;transform:translateX(-50%);padding:12px 18px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-weight:700;display:none}
#gameOver{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);backdrop-filter:blur(5px)}
.overCard{width:min(90vw,420px);background:#111827;color:white;border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:25px;text-align:center}
.overCard h2{margin-top:0}
#finalScore{font-size:30px;color:#ffd34d;font-weight:900}
.small{font-size:12px;color:#aeb8c9;line-height:1.7}
.flash{animation:flash .25s 2}
@keyframes flash{50%{opacity:.2}}
@media(max-width:600px){
 .menuCard{padding:20px;border-radius:22px}
 .menuCard h1{font-size:26px}
 #player{width:100px;height:75px;left:7vw}
 .obstacle{width:64px;height:72px}
 .textObstacle{font-size:16px;min-width:80px;padding:8px}
 .hudBox{min-width:145px}
}
</style>
</head>
<body>
<div id="app">
  <div id="gameBg"></div>
  <div id="ground"></div>

  <div id="hud">
    <div class="hudBox" id="score">کنده کاری: 0</div>
    <div class="hudBox" id="best">بهترین کنده کاری شما: 0</div>
  </div>

  <img id="rollImage" alt="">

  <section id="menu">
    <div class="menuCard">
      <h1>🏁 حرکت کن اشغال 🏁</h1>
      <p>701رانِ بشا</p>
      <input id="playerName" maxlength="20" placeholder="نام ک.شعرت را بنویس">
      <button id="startBtn">بزن بریم کنده کاری⛏️</button>
      <button id="resetNameBtn">بداية جديدة</button>
      <div id="leaderboard">
        <h3>🏆 ደረጃ ሰንጠረዥ(آنلاین)</h3>
        <div id="lbList"><div class="small">عآح عآح عآح... درحال بارگذاری... عآح</div></div>
      </div>
      <div class="small" style="margin-top:14px">تو صفحه بازی کاراکترو یه انگشتش کن تا حرکت شروع بشه.</div>
    </div>
  </section>

  <main id="game">
    <img id="player" alt="بازیکن">
    <img id="boss" alt="کاراکتر ویژه">
    <div id="tapHint">کاراکترو یه انگشتش کن تا حرکت شروع بشه</div>
  </main>

  <div id="gameOver">
    <div class="overCard">
      <h2 id="overTitle">خراب کردی همه چیزو خودت</h2>
      <div id="finalScore">0</div>
      <p id="overText">کنده کاریای شما</p>
      <button id="againBtn" style="background:#ffd34d">دوباره کنده کاری کن</button>
      <button id="menuBtn" style="background:#2b3446;color:white">بازگشت به منو</button>
    </div>
  </div>
</div>

<script>
/*
=========================================================
تنظیمات اصلی بازی — فقط همین بخش را برای عکس‌های خودت تغییر بده
=========================================================
*/
const CONFIG = {
  // آدرس Worker کلودفلیر بعد از Deploy. مثال:
  // "https://your-game-worker.your-subdomain.workers.dev"
  WORKER_URL: "https://topdown-shooter-server.arashbashavard824.workers.dev/",

  // عکس ماشین/کاراکتر در حالت عادی
  PLAYER_IMAGES: [
    "kamel.webp",
    "kamel.webp",
    "kamel.webp",
    "kamel.webp"
  ],

  // عکس‌هایی که جای کاکتوس می‌آیند
  OBSTACLE_IMAGES: [
    "sharifi.jpg",
    "gh.jpg",
    "nezam.jpg"
  ],

  // عکس شخصیت ویژه‌ای که در امتیاز 1000 ظاهر می‌شود
  BOSS_IMAGE: "shahedi1.jpg",

  // عکسی که با زدن شروع از بالا قل می‌خورد و می‌افتد
  ROLL_IMAGE: "sfr.jpg",

  // هر چند امتیاز سرعت بیشتر شود
  SPEED_STEP_SCORE: 100,

  // سرعت اولیه و افزایش سرعت
  INITIAL_SPEED: 5.5,
  SPEED_INCREASE: 0.25
};

const $ = id => document.getElementById(id);
const player = $("player"), game = $("game"), menu = $("menu");
const scoreEl = $("score"), bestEl = $("best"), tapHint = $("tapHint");
const boss = $("boss"), gameOver = $("gameOver"), rollImage = $("rollImage");
const nameInput = $("playerName"), lbList = $("lbList");
const MIN_OBSTACLE_DISTANCE = 450;

let account = JSON.parse(localStorage.getItem("runnerAccount") || "null");
let score = 0, best = 0, speed = CONFIG.INITIAL_SPEED;
let running = false, startedOnce = false, raf = null, lastTime = 0;
let obstacleTimer = 0;
let nextObstacleTime = 2500, bossActive = false, bossTriggered = false;
let obstacles = [];
let jumpY = 0, vy = 0, grounded = true;

function safeName() {
  const n = (nameInput.value || "").trim();
  return n.slice(0,20) || "بازیکن";
}

function createLocalAccount(name) {
  account = account || {id: crypto.randomUUID(), name:name, best:0};
  account.name = name;
  account.best = Number(account.best || 0);
  localStorage.setItem("runnerAccount", JSON.stringify(account));
  nameInput.value = account.name;
  best = account.best;
  bestEl.textContent = "کنده کاری قبل: " + best;
}

function getApi(path, options={}) {
  if (!CONFIG.WORKER_URL) return Promise.resolve(null);
  return fetch(CONFIG.WORKER_URL.replace(/\/$/,"") + path, {
    ...options, headers: {"Content-Type":"application/json", ...(options.headers||{})}
  }).then(r => r.ok ? r.json() : null).catch(() => null);
}

async function loadAccount() {
  if (!account) return;
  const data = await getApi("/api/account?id=" + encodeURIComponent(account.id));
  if (data && data.account) {
    account = data.account;
    localStorage.setItem("runnerAccount", JSON.stringify(account));
  }
  best = Number(account.best || 0);
  bestEl.textContent = "کنده کاری قبل: " + best;
}

async function loadLeaderboard() {
  const data = await getApi("/api/leaderboard");
  if (!data || !Array.isArray(data.leaderboard)) {
    // حالت آفلاین: رکورد فعلی همین دستگاه
    if (account) {
      lbList.innerHTML = `<div class="lbRow"><span>۱. ${escapeHtml(account.name)}</span><span>${account.best}</span></div>`;
    }
    return;
  }
  lbList.innerHTML = data.leaderboard.slice(0,10).map((x,i) =>
    `<div class="lbRow"><span>${i+1}. ${escapeHtml(x.name)}</span><span>${Number(x.best)}</span></div>`
  ).join("");
}

async function saveScore() {
  if (score <= best) return;
  best = Math.floor(score);
  account.best = best;
  localStorage.setItem("runnerAccount", JSON.stringify(account));
  bestEl.textContent = "کنده کاری قبل: " + best;
  await getApi("/api/score", {
    method:"POST",
    body:JSON.stringify({id:account.id,name:account.name,score:best})
  });
  loadLeaderboard();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function setPlayerImage() {
  const index = Math.min(
    CONFIG.PLAYER_IMAGES.length - 1,
    Math.floor(score / CONFIG.SPEED_STEP_SCORE)
  );
  player.src = CONFIG.PLAYER_IMAGES[index] || CONFIG.PLAYER_IMAGES[0];
}

function currentSpeed() {
  return CONFIG.INITIAL_SPEED + Math.floor(score / CONFIG.SPEED_STEP_SCORE) * CONFIG.SPEED_INCREASE;
}

function resetGameState() {
  score = 0; speed = CONFIG.INITIAL_SPEED; running = false; startedOnce = false;
  bossActive = false; bossTriggered = false; obstacleTimer = 0; textTimer = 0;
  jumpY = 0; vy = 0; grounded = true;
  boss.style.display = "none";
  boss.style.right = "-190px";
  document.querySelectorAll(".obstacle").forEach(x=>x.remove());
  obstacles = [];
  scoreEl.textContent = "کنده کاری: 0";
  setPlayerImage();
  player.style.left = "10vw";
  player.style.bottom = "13%";
}

function openGame() {
  menu.classList.add("hide");
  game.classList.add("ready");
  $("hud").style.display = "flex";
  tapHint.style.display = "block";
  resetGameState();
  setTimeout(() => tapHint.style.display="none", 2800);
}

function startMenuAnimation() {
  createLocalAccount(safeName());
  rollImage.src = CONFIG.ROLL_IMAGE;
  rollImage.classList.remove("roll");
  void rollImage.offsetWidth;
  rollImage.classList.add("roll");
  setTimeout(openGame, 1350);
}

function beginRun() {
  if (running) return;
  running = true; startedOnce = true; lastTime = performance.now();
  tapHint.style.display = "none";
  requestAnimationFrame(loop);
}

function jump() {
  if (!running) { beginRun(); return; }
  if (grounded) {
    grounded = false;
    vy = 15;
  }
}

function spawnImageObstacle() {
if(obstacles.length){

    let last = obstacles[obstacles.length-1];

    if(last.x > innerWidth - 500){
        return;
    }

}
  const el = document.createElement("img");
  el.className = "obstacle";
  el.src = CONFIG.OBSTACLE_IMAGES[Math.floor(Math.random()*CONFIG.OBSTACLE_IMAGES.length)];
  el.style.left = "calc(100vw + 30px)";
  el.style.width = (60 + Math.random()*30) + "px";
  el.style.height = (65 + Math.random()*30) + "px";
  game.appendChild(el);
  obstacles.push({el, x:innerWidth+30, kind:"image", w:75, h:80});
}

function spawnTextObstacle() {
if(obstacles.length){

    let last = obstacles[obstacles.length-1];

    if(last.x > innerWidth - 500){
        return;
    }

}
  const words = ["ادواری","پایش","پایان ترم"];
  const el = document.createElement("div");
  el.className = "obstacle textObstacle";
  el.textContent = words[Math.floor(Math.random()*words.length)];
  el.style.left = "calc(100vw + 30px)";
  game.appendChild(el);
  obstacles.push({el, x:innerWidth+30, kind:"text", w:120, h:55});
}

function hitTest(a,b) {
  const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
  return ar.left < br.right-8 && ar.right > br.left+8 && ar.top < br.bottom-8 && ar.bottom > br.top+8;
}

function triggerBoss() {
  bossActive = true; bossTriggered = true;
  boss.src = CONFIG.BOSS_IMAGE;
  boss.style.display = "block";
  boss.style.right = "-190px";
  boss.animate(
    [{right:"-190px"},{right:"14vw"}],
    {duration:1300,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"}
  ).finished.then(() => {
    // بازیکن مقابل شخصیت ویژه قرار می‌گیرد، سپس زمین زیرش خالی می‌شود
    player.animate(
      [{transform:"translateY(0)"},{transform:"translateY(12px)"},{transform:"translateY(115vh) rotate(35deg)"}],
      {duration:1500,easing:"ease-in",fill:"forwards"}
    ).finished.then(() => endRun(true));
  }).catch(()=>endRun(true));
}

function endRun(bossEnd=false) {
  if (!running) return;
  running = false;
  cancelAnimationFrame(raf);
  saveScore();
  $("finalScore").textContent = score;
  $("overTitle").textContent = bossEnd ? "🎉 گا.ییده شدید و گیم تمام شد!" : "سیکت خورد";
  $("overText").textContent = bossEnd
    ? "درسته که شاهدی خاموش عمل میکنه اما در نهایت همه مونو میکنه"
    : "میزان کنده کاری شما";
  gameOver.style.display = "flex";
}

function restart() {
  gameOver.style.display = "none";
  resetGameState();
  player.style.transform = "";
  tapHint.style.display = "block";
  setTimeout(()=>tapHint.style.display="none",2200);
}

function returnMenu() {
  gameOver.style.display = "none";
  $("hud").style.display = "none";
  game.classList.remove("ready");
  menu.classList.remove("hide");
  player.style.transform = "";
  resetGameState();
  loadLeaderboard();
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(32, now-lastTime);
  lastTime = now;
  speed = currentSpeed();

  // امتیاز: تقریبا هر ثانیه یک امتیاز
score += dt / 1000;
  const shown = Math.floor(score);
scoreEl.textContent = "کنده کاری: " + Math.floor(score);
  if (shown > 0 && shown % CONFIG.SPEED_STEP_SCORE === 0) {
    setPlayerImage();
  }

  // پرش ساده
  if (!grounded) {
    jumpY += vy * dt * .055;
    vy -= 0.8 * dt * .055;
    if (jumpY <= 0) { jumpY=0; vy=0; grounded=true; }
  }
  player.style.transform = `translateY(${-jumpY}px)`;

obstacleTimer += dt;


if(obstacleTimer > nextObstacleTime){


    obstacleTimer = 0;


    // انتخاب تصادفی نوع مانع
    let chance = Math.random();


    if(chance < 0.55){

        // 55 درصد عکس
        spawnImageObstacle();

    }else{

        // 45 درصد نوشته
        spawnTextObstacle();

    }



    // فاصله تصادفی بین موانع
    nextObstacleTime =
        Math.max(
            1700,
            3200 - speed * 80
        )
        +
        Math.random()*1200;

}

  for (let i=obstacles.length-1;i>=0;i--) {
    const o = obstacles[i];
    o.x -= speed * dt * .11;
    o.el.style.left = o.x + "px";
    if (hitTest(player,o.el)) {
      endRun(false);
      return;
    }
    if (o.x < -220) {
      o.el.remove();
      obstacles.splice(i,1);
    }
  }

  if (!bossTriggered && Math.floor(score) >= 1000) {
    triggerBoss();
    return;
  }

  raf = requestAnimationFrame(loop);
}

$("startBtn").addEventListener("click", () => {

  const name = safeName();

  if(!nameInput.value.trim()){

    alert("اسمتو وارد کن ک...");
    nameInput.focus();
    return;

  }


  if(!account){

    account = {

      id: crypto.randomUUID(),

      name:name,

      best:0

    };

  }else{

    account.name = name;

  }


  localStorage.setItem(
    "runnerAccount",
    JSON.stringify(account)
  );


  best = account.best || 0;

  bestEl.textContent =
    "کنده کاری قبل: " + best;


  startMenuAnimation();

});

$("resetNameBtn").addEventListener("click", () => {
  localStorage.removeItem("runnerAccount");
  account = null;
  nameInput.value = "";
  best = 0;
  bestEl.textContent = "کنده کاری قبل: 0";
  loadLeaderboard();
  nameInput.focus();
});

$("player").addEventListener("pointerdown", e => { e.preventDefault(); jump(); });
$("game").addEventListener("pointerdown", e => {
  if (e.target !== player) jump();
});
window.addEventListener("keydown", e => {
  if (["Space","ArrowUp","Enter"].includes(e.code)) { e.preventDefault(); jump(); }
});
$("againBtn").addEventListener("click", restart);
$("menuBtn").addEventListener("click", returnMenu);

(function init(){
  if (account) {
    nameInput.value = account.name || "";
    best = Number(account.best || 0);
    bestEl.textContent = "کنده کاری قبل: " + best;
    loadAccount();
  }
  loadLeaderboard();
})();
</script>
</body>
</html>
